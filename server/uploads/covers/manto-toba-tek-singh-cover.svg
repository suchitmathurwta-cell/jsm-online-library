<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <defs>
    <linearGradient id="bgGrad-manto-toba-tek-singh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042116" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#042116" />
    </linearGradient>
    <pattern id="pat-manto-toba-tek-singh" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#a7f3d0" stroke-width="0.8" opacity="0.18" />
      <circle cx="20" cy="20" r="4" fill="#a7f3d0" opacity="0.25" />
      <line x1="0" y1="20" x2="40" y2="20" stroke="#a7f3d0" stroke-width="0.5" opacity="0.12" />
      <line x1="20" y1="0" x2="20" y2="40" stroke="#a7f3d0" stroke-width="0.5" opacity="0.12" />
    </pattern>
  </defs>
  <rect width="600" height="850" fill="url(#bgGrad-manto-toba-tek-singh)" />
  <rect width="600" height="850" fill="url(#pat-manto-toba-tek-singh)" />
  
  <!-- Outer & Inner Golden Borders -->
  <rect x="25" y="25" width="550" height="800" rx="14" fill="none" stroke="#a7f3d0" stroke-width="2.5" opacity="0.9" />
  <rect x="35" y="35" width="530" height="780" rx="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  
  <!-- Header Branding -->
  <text x="300" y="80" text-anchor="middle" font-family="'Noto Serif Devanagari', 'Georgia', serif" font-size="22" fill="#a7f3d0" font-weight="bold" letter-spacing="3">चेतना डिजिटल पुस्तकालय</text>
  <text x="300" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" letter-spacing="3" opacity="0.9">CHETNA LIBRARY FOR CULTURAL CONSCIENCE & DEVELOPMENT</text>
  <line x1="140" y1="120" x2="460" y2="120" stroke="#a7f3d0" stroke-width="1" opacity="0.6" />
  
  <!-- Genre Pill -->
  <rect x="180" y="138" width="240" height="32" rx="16" fill="rgba(0,0,0,0.55)" stroke="#a7f3d0" stroke-width="1" />
  <text x="300" y="159" text-anchor="middle" font-family="'Noto Sans Devanagari', Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="600">कहानी • यथार्थवादी कहानी व म</text>
  
  <!-- Book Title Box -->
  <rect x="55" y="210" width="490" height="260" rx="12" fill="rgba(0,0,0,0.65)" stroke="#a7f3d0" stroke-width="1.5" />
  <text x="300" y="280" text-anchor="middle" font-family="'Noto Serif Devanagari', Georgia, serif" font-size="32" fill="#ffffff" font-weight="bold">टोबा टेक सिंह व प्रतिनिधि कहानिय</text>
  <text x="300" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#a7f3d0" font-weight="600" font-style="italic">Toba Tek Singh & Master Stories of Hum</text>
  <text x="300" y="390" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif" font-size="24" fill="rgba(255,255,255,0.85)">ٹوبہ ٹیک سنگھ و شاہکار افسانے</text>
  <text x="300" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a7f3d0">Year: 1955 CE • STORY</text>
  
  <!-- Ornamental Lotus Motif -->
  <g transform="translate(300, 520)" fill="#a7f3d0">
    <circle cx="0" cy="0" r="5" />
    <path d="M-50,0 Q-25,-14 0,0 Q25,-14 50,0" stroke="#a7f3d0" stroke-width="2" fill="none" />
    <path d="M-50,0 Q-25,14 0,0 Q25,14 50,0" stroke="#a7f3d0" stroke-width="2" fill="none" />
  </g>
  
  <!-- Author Section -->
  <text x="300" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" letter-spacing="3">रचयिता / CREATOR / مصنف</text>
  <text x="300" y="630" text-anchor="middle" font-family="'Noto Serif Devanagari', Georgia, serif" font-size="28" fill="#ffffff" font-weight="bold">सआदत हसन मंटो</text>
  <text x="300" y="670" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#a7f3d0">Saadat Hasan Manto</text>
  
  <!-- Footer Info -->
  <line x1="100" y1="725" x2="500" y2="725" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="120" y="760" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Year: 1955 CE</text>
  <text x="480" y="760" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Pages: 240</text>
  <text x="300" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a7f3d0">Chetna Library for Cultural Conscience & Development • Open Access</text>
</svg>