      <stop offset="0%" stop-color="#290404" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#290404" />
    </linearGradient>
    <pattern id="pat-dalit-chetna-vimarsh" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#fca5a5" stroke-width="0.8" opacity="0.18" />
      <circle cx="20" cy="20" r="4" fill="#fca5a5" opacity="0.25" />
      <line x1="0" y1="20" x2="40" y2="20" stroke="#fca5a5" stroke-width="0.5" opacity="0.12" />
      <line x1="20" y1="0" x2="20" y2="40" stroke="#fca5a5" stroke-width="0.5" opacity="0.12" />
    </pattern>
  </defs>
  <rect width="600" height="850" fill="url(#bgGrad-dalit-chetna-vimarsh)" />
  <rect width="600" height="850" fill="url(#pat-dalit-chetna-vimarsh)" />
  
  <!-- Outer & Inner Golden Borders -->
  <rect x="25" y="25" width="550" height="800" rx="14" fill="none" stroke="#fca5a5" stroke-width="2.5" opacity="0.9" />
  <rect x="35" y="35" width="530" height="780" rx="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  
  <!-- Header Branding -->
