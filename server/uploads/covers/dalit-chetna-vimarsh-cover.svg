    <path d="M-50,0 Q-25,-14 0,0 Q25,-14 50,0" stroke="#fca5a5" stroke-width="2" fill="none" />
    <path d="M-50,0 Q-25,14 0,0 Q25,14 50,0" stroke="#fca5a5" stroke-width="2" fill="none" />
