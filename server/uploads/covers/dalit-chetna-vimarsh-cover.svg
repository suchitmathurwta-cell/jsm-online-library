  <text x="480" y="760" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Pages: 210</text>
  <text x="300" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5">Chetna Library for Cultural Conscience & Development • Open Access</text>
