  <text x="300" y="159" text-anchor="middle" font-family="'Noto Sans Devanagari', Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="600">विमर्श • दलित विमर्श व सामाजि</text>
  
  <!-- Book Title Box -->
  <rect x="55" y="210" width="490" height="260" rx="12" fill="rgba(0,0,0,0.65)" stroke="#fca5a5" stroke-width="1.5" />
  <text x="300" y="280" text-anchor="middle" font-family="'Noto Serif Devanagari', Georgia, serif" font-size="32" fill="#ffffff" font-weight="bold">दलित साहित्य का सौंदर्यशास्त्र (</text>
  <text x="300" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#fca5a5" font-weight="600" font-style="italic">Aesthetics of Dalit Literature (Social</text>
  <text x="300" y="390" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif" font-size="24" fill="rgba(255,255,255,0.85)">دلت ادب کی جمالیات اور فکری مکالمہ</text>
  <text x="300" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fca5a5">Year: 2000 CE • VIMARSH</text>
  
