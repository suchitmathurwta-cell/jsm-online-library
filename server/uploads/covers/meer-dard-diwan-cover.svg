<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180720" />
      <stop offset="50%" stop-color="#7b1fa2" />
      <stop offset="100%" stop-color="#180720" />
    </linearGradient>
    <pattern id="pat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
      <circle cx="20" cy="20" r="4" fill="rgba(212,175,55,0.15)" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="850" fill="url(#bgGrad)" />
  <rect width="600" height="850" fill="url(#pat)" />
  
  <!-- Book Outer Frame (Rekhta Vintage Style) -->
  <rect x="25" y="25" width="550" height="800" rx="8" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.85" />
  <rect x="35" y="35" width="530" height="780" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  
  <!-- Corner Ornaments -->
  <g fill="#a855f7" opacity="0.8">
    <polygon points="40,40 65,40 40,65" />
    <polygon points="560,40 535,40 560,65" />
    <polygon points="40,810 65,810 40,785" />
    <polygon points="560,810 535,810 560,785" />
  </g>
  
  <!-- Header Branding -->
  <text x="300" y="85" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#a855f7" letter-spacing="4" font-weight="bold">rekhta e-books</text>
  <line x1="180" y1="100" x2="420" y2="100" stroke="#a855f7" stroke-width="1" opacity="0.6" />
  
  <!-- Category Badge -->
  <rect x="210" y="125" width="180" height="30" rx="15" fill="rgba(0,0,0,0.4)" stroke="#a855f7" stroke-width="1" />
  <text x="300" y="145" text-anchor="middle" font-family="'Noto Sans Devanagari', Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="500">???? ????</text>
  
  <!-- Book Main Title Box -->
  <rect x="60" y="220" width="480" height="260" rx="6" fill="rgba(0,0,0,0.5)" stroke="#a855f7" stroke-width="1.5" />
  
  <!-- Urdu Title -->
  <text x="300" y="290" text-anchor="middle" font-family="'Jameel Noori Nastaleeq', 'Amiri', serif" font-size="44" fill="#a855f7" font-weight="bold">?????? ????? ??? ???</text>
  
  <!-- Hindi Title -->
  <text x="300" y="360" text-anchor="middle" font-family="'Rozha One', 'Noto Serif Devanagari', Georgia, serif" font-size="34" fill="#ffffff" font-weight="bold">?????-?-??????? ??? ????</text>
  
  <!-- English Title -->
  <text x="300" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="rgba(255,255,255,0.85)" font-style="italic" letter-spacing="1">Diwan-e-Khwaja Meer Dard</text>
  
  <!-- Decorative Motif -->
  <g transform="translate(300, 525)" fill="#a855f7">
    <circle cx="0" cy="0" r="6" />
    <path d="M-50,0 Q-25,-10 0,0 Q25,-10 50,0" stroke="#a855f7" stroke-width="2" fill="none" />
    <path d="M-50,0 Q-25,10 0,0 Q25,10 50,0" stroke="#a855f7" stroke-width="2" fill="none" />
  </g>
  
  <!-- Author Section -->
  <text x="300" y="580" text-anchor="middle" font-family="'Noto Sans Devanagari', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" letter-spacing="2">?????? / AUTHOR</text>
  <text x="300" y="625" text-anchor="middle" font-family="'Rozha One', 'Noto Serif Devanagari', Georgia, serif" font-size="26" fill="#ffffff" font-weight="bold">??????? ??? ????</text>
  <text x="300" y="665" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#a855f7" font-style="italic">Khwaja Meer Dard</text>
  
  <!-- Footer Details -->
  <line x1="120" y1="720" x2="480" y2="720" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="150" y="755" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">????: 1785</text>
  <text x="450" y="755" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">?????: 210</text>
  <text x="300" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a855f7">?????? ????????? ??????? ? ???????? ???????</text>
</svg>